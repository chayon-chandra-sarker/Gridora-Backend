
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Gridora - Google Login Test</title>

  <script src="https://accounts.google.com/gsi/client" async defer></script>

  <style>
    body {
      font-family: Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      background: #f5f5f5;
    }

    .container {
      background: white;
      padding: 40px;
      border-radius: 12px;
      text-align: center;
      box-shadow: 0 5px 20px rgba(0, 0, 0, 0.1);
    }

    h1 {
      margin-bottom: 25px;
    }

    #token {
      width: 500px;
      max-width: 90%;
      height: 150px;
      margin-top: 20px;
      padding: 10px;
    }

    button {
      margin-top: 15px;
      padding: 10px 20px;
      cursor: pointer;
    }
  </style>
</head>

<body>
  <div class="container">
    <h1>Gridora Google Login Test</h1>

    <!-- Google Login -->
    <div
      id="g_id_onload"
      data-client_id="646677161853-h12pou4bp5jit268sqdlf25mn3c8nfm7.apps.googleusercontent.com"
      data-callback="handleCredentialResponse">
    </div>

    <div class="g_id_signin"></div>

    <h3>Google ID Token</h3>

    <textarea
      id="token"
      placeholder="Google ID Token will appear here..."
      readonly>
    </textarea>

    <br />

    <button onclick="copyToken()">
      Copy ID Token
    </button>
  </div>

  <script>
    function handleCredentialResponse(response) {
      console.log("Google ID Token:", response.credential);

      document.getElementById("token").value = response.credential;
    }

    function copyToken() {
      const token = document.getElementById("token").value;

      if (!token) {
        alert("Please login with Google first.");
        return;
      }

      navigator.clipboard.writeText(token);
      alert("ID Token copied!");
    }
  </script>
</body>
</html>
